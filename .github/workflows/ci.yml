name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-quality:
    name: PHP quality (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3']
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: sodium, json, mysqli
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: PHPCS (WordPress Coding Standards)
        run: composer lint

      - name: PHPStan
        run: composer analyze

  php-test:
    name: PHPUnit (wp-env)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json, mysqli
          coverage: none

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Start wp-env
        run: npx wp-env start

      # wp-env はリポジトリのルートを wp-content/cbjp-dev にマウントする（テスト・i18n・スキルが使う）。ルートの .htaccess で HTTP を拒否できているか（D29・R3-7）。
      - name: Check that the repository root is not served
        run: bin/check-dev-mount.sh

      # 無料版（WooCommerce と無料版だけを読み込む）のテスト。プラグインのマウントを cwd にして、ルートの PHPUnit で実行する。
      - name: Run PHPUnit
        run: composer test:wpenv

      # ビルド済みの JS と PHP から POT を作り直し、コミット済みの plugins/cart-bridge-jp/languages/cart-bridge-jp.pot と文字列が同じか確かめる（R3-2）。
      # PO・生成物（.mo / .l10n.php / JSON）が POT と揃っているかは PHPUnit の TranslationsTest が確かめる。
      - name: Check that translations are up to date
        run: npm run i18n:check

  js:
    name: JS/TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Lint (ESLint + tsc)
        run: npm run lint

      - name: Unit tests (Jest)
        run: npm run test:js

      - name: Build
        run: npm run build

  dev-tooling:
    name: Dev tooling (cbj-dev-cycle scripts)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Regression test for gate-bodies.sh
        run: .claude/skills/cbj-dev-cycle/scripts/test-gate-bodies.sh

      - name: Regression test for gate-turn.sh
        run: .claude/skills/cbj-dev-cycle/scripts/test-gate-turn.sh

      - name: Regression test for gate-record.sh
        run: .claude/skills/cbj-dev-cycle/scripts/test-gate-record.sh
