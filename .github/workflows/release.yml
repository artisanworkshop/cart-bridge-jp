name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json, mysqli
          coverage: none

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # 無料版（plugins/cart-bridge-jp）の zip。ビルド・composer install --no-dev・.distignore・中身の検査は CI の Distribution ジョブと同じスクリプト（D29・R3-7）。
      - name: Build and check the plugin zip
        run: bin/build-zip.sh --version "${{ steps.version.outputs.VERSION }}" --out .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: cart-bridge-jp-${{ steps.version.outputs.VERSION }}.zip
