name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: sodium, json, mysqli
          coverage: none

      - name: Install Composer dependencies (runtime only)
        run: composer install --no-dev --optimize-autoloader --prefer-dist --no-progress --no-interaction

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies & build
        run: |
          npm ci
          npm run build

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Create plugin zip
        run: |
          PLUGIN_SLUG="cart-bridge-jp"
          VERSION="${{ steps.version.outputs.VERSION }}"
          DEST="${PLUGIN_SLUG}-${VERSION}"

          # Copy release files to staging directory
          mkdir -p "/tmp/${DEST}/${PLUGIN_SLUG}"
          rsync -a \
            --exclude-from='.distignore' \
            . "/tmp/${DEST}/${PLUGIN_SLUG}/"

          # Create zip
          cd "/tmp/${DEST}"
          zip -rq "${PLUGIN_SLUG}-${VERSION}.zip" "${PLUGIN_SLUG}/"

          # Move to workspace
          mv "${PLUGIN_SLUG}-${VERSION}.zip" "$GITHUB_WORKSPACE/"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: cart-bridge-jp-${{ steps.version.outputs.VERSION }}.zip
